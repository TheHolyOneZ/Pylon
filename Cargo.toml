[workspace]
members = ["src-tauri"]
resolver = "2"

# Crypto/image crates are painfully slow unoptimised (Argon2 takes seconds in
# debug). Optimise just those deps so `tauri dev` stays responsive.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.libssh2-sys]
opt-level = 3
[profile.dev.package.openssl-sys]
opt-level = 3

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
